<div class="inline-drawer stw-extension-drawer">
  <div class="inline-drawer-toggle inline-drawer-header stw-extension-header">
    <b>角色音乐播放器</b>
    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down"></div>
  </div>
  <div class="inline-drawer-content stw-settings">
    <div class="stw-settings-head"><div><div class="stw-title">角色音乐播放器</div><div class="stw-subtitle">角色绑定 / 全局音乐 / 独立可替换皮肤</div></div><label class="stw-switch"><input id="stw-enabled" type="checkbox"><span></span></label></div>
    <div class="stw-tabs"><button class="stw-tab active" data-tab="music">音乐</button><button class="stw-tab" data-tab="theme">美化</button><button class="stw-tab" data-tab="settings">设置</button></div>
    <section class="stw-tab-panel active" data-panel="music">
      <div class="stw-card"><div class="stw-card-title">角色绑定管理</div><div class="stw-help">读取当前酒馆可用的全部角色。勾选「绑定」即可绑定；记录只保存在你的扩展设置里，不会写入角色卡。</div><div id="stw-character-list" class="stw-character-list"></div></div>
      <div class="stw-card"><div class="stw-card-title">当前角色</div><div id="stw-current-character" class="stw-help">当前没有选择角色</div><label class="stw-check"><input id="stw-bind" type="checkbox"> 绑定当前角色</label><label class="stw-check"><input id="stw-char-enabled" type="checkbox"> 当前角色启用播放器</label><label class="stw-check"><input id="stw-char-visible" type="checkbox"> 当前角色显示播放器</label><div class="stw-grid"><input id="stw-char-skin" placeholder="当前角色皮肤 CSS URL；留空=全局/默认黎奖皮肤"></div><div class="stw-help">当前角色的皮肤可以单独覆盖全局皮肤。</div></div>
      <div class="stw-card"><div class="stw-card-title">歌单位置</div><div class="stw-row"><select id="stw-scope"><option value="global">全局歌单</option></select><button id="stw-use-current" class="stw-btn">使用当前角色</button></div><div class="stw-help">选择任意角色后，下面添加的歌曲 URL 会保存到该角色自己的歌单。</div></div>
      <div class="stw-card"><div class="stw-card-title">添加歌曲</div><div class="stw-grid"><input id="stw-song-title" placeholder="歌曲名字"><input id="stw-song-url" placeholder="音频 URL（mp3 / m4a / ogg / wav 等）"><input id="stw-song-cover" placeholder="封面 URL（可留空）"></div><button id="stw-add-song" class="stw-btn stw-primary">添加到当前歌单</button></div>
      <div class="stw-card"><div class="stw-card-title">当前歌单</div><div id="stw-playlist" class="stw-playlist"></div></div>
    </section>
    <section class="stw-tab-panel" data-panel="theme">
      <div class="stw-card"><div class="stw-card-title">主题管理</div><div class="stw-row"><select id="stw-theme-select"></select><button id="stw-theme-new" class="stw-btn">新建</button><button id="stw-theme-duplicate" class="stw-btn">复制</button></div><div class="stw-row stw-theme-io"><button id="stw-theme-import" class="stw-btn">导入主题 JSON</button><button id="stw-theme-export" class="stw-btn">导出主题 JSON</button><button id="stw-css-import" class="stw-btn">导入 CSS</button><button id="stw-css-export" class="stw-btn">导出 CSS</button><input id="stw-theme-file" type="file" accept=".json,application/json" hidden><input id="stw-css-file" type="file" accept=".css,text/css" hidden></div><div class="stw-help">JSON 用于完整主题备份；CSS 用于直接分享或交换当前主题样式。</div></div>
      <div class="stw-card"><div class="stw-card-title">主题信息</div><div class="stw-grid"><input id="stw-theme-name" placeholder="主题名称"><input id="stw-theme-author" placeholder="作者"><input id="stw-theme-version" placeholder="版本号"><input id="stw-theme-launcher" placeholder="悬浮按钮图片 URL（可留空）"><input id="stw-theme-bg" placeholder="播放器背景图片 URL（可留空）"><input id="stw-theme-accent" placeholder="强调色，例如 #9acbff"></div><textarea id="stw-theme-css" class="stw-code" spellcheck="false" placeholder="在这里直接写完整 CSS。主题只影响音乐播放器，不会修改酒馆其他界面。"></textarea><div class="stw-row"><button id="stw-theme-save" class="stw-btn stw-primary">保存并应用</button><button id="stw-theme-delete" class="stw-btn stw-danger">删除当前主题</button></div></div>
    </section>
    <section class="stw-tab-panel" data-panel="settings">
      <div class="stw-card"><div class="stw-card-title">作用范围与全局皮肤</div><label class="stw-check"><input id="stw-bound-only" type="checkbox"> 只在已绑定角色时显示播放器</label><label class="stw-check"><input id="stw-global-visible" type="checkbox"> 允许全局播放器显示</label><input id="stw-global-skin" placeholder="全局皮肤 CSS URL；留空=内置「黎奖·逍遥留白」" style="box-sizing:border-box;width:100%;border:1px solid rgba(127,157,190,.22);border-radius:9px;background:rgba(0,0,0,.18);color:inherit;padding:9px"><div class="stw-help">优先级：角色皮肤 ＞ 全局皮肤 ＞ 插件内置黎奖皮肤。</div></div>
      <div class="stw-card"><div class="stw-card-title">播放设置</div><label class="stw-check"><input id="stw-auto-character" type="checkbox"> 切换角色时自动切换到该角色歌单</label><label class="stw-check"><input id="stw-fallback-global" type="checkbox"> 角色没有歌曲时使用全局歌单</label><label class="stw-check"><input id="stw-autoplay" type="checkbox"> 切换歌单后自动播放（浏览器可能限制自动播放）</label><div class="stw-volume-line"><span>默认音量</span><input id="stw-volume" type="range" min="0" max="1" step="0.01"></div></div>
      <div class="stw-card"><div class="stw-card-title">数据</div><div class="stw-row"><button id="stw-data-export" class="stw-btn">导出音乐数据</button><button id="stw-data-import" class="stw-btn">导入音乐数据</button><input id="stw-data-file" type="file" accept=".json,application/json" hidden></div><div class="stw-help">音乐数据和主题数据分开保存。导入音乐数据不会覆盖主题。</div></div>
    </section>
  </div>
</div>
