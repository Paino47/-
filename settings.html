<div class="inline-drawer stw-extension-drawer">
  <div class="inline-drawer-toggle inline-drawer-header stw-extension-header">
    <b>角色音乐播放器</b>
    <div class="inline-drawer-icon fa-solid fa-circle-chevron-down"></div>
  </div>

  <div class="inline-drawer-content stw-settings">
    <div class="stw-settings-head">
      <div>
        <div class="stw-title">角色音乐播放器</div>
        <div class="stw-subtitle">全局与角色分开管理，角色歌单和皮肤互不混淆</div>
      </div>
    </div>

    <div class="stw-card stw-runtime-card">
      <div class="stw-card-title">运行开关</div>
      <div class="stw-setting-row"><span>插件开启</span><label class="stw-switch"><input id="stw-enabled" type="checkbox"><i></i></label></div>
      <div class="stw-setting-row"><span>悬浮窗开启</span><label class="stw-switch"><input id="stw-floating-enabled" type="checkbox"><i></i></label></div>
    </div>

    <div class="stw-tabs" role="tablist">
      <button type="button" class="stw-tab active" data-tab="global" role="tab" aria-selected="true">全局</button>
      <button type="button" class="stw-tab" data-tab="character" role="tab" aria-selected="false">角色</button>
    </div>

    <section class="stw-tab-panel active" data-panel="global">
      <div class="stw-card">
        <div class="stw-card-title">全局播放器</div>
        <div id="stw-global-editor"></div>
      </div>

      <div class="stw-card">
        <div class="stw-card-title">全局皮肤</div>
        <div class="stw-row"><select id="stw-theme-select"></select><button type="button" id="stw-theme-new" class="stw-btn">新建</button><button type="button" id="stw-theme-duplicate" class="stw-btn">复制</button></div>
        <div class="stw-row stw-theme-io">
          <button type="button" id="stw-theme-import" class="stw-btn">导入主题 JSON</button>
          <button type="button" id="stw-theme-export" class="stw-btn">导出主题 JSON</button>
          <button type="button" id="stw-css-import" class="stw-btn">导入 CSS</button>
          <button type="button" id="stw-css-export" class="stw-btn">导出 CSS</button>
          <input id="stw-theme-file" type="file" accept=".json,application/json" hidden>
          <input id="stw-css-file" type="file" accept=".css,text/css" hidden>
        </div>
        <div class="stw-grid">
          <input id="stw-theme-name" placeholder="主题名称">
          <input id="stw-theme-author" placeholder="作者">
          <input id="stw-theme-version" placeholder="版本号">
          <input id="stw-theme-launcher" placeholder="悬浮按钮图片 URL（可留空）">
          <input id="stw-theme-bg" placeholder="播放器背景图片 URL（可留空）">
          <input id="stw-theme-accent" placeholder="强调色，例如 #d8c8a8">
        </div>
        <textarea id="stw-theme-css" class="stw-code" spellcheck="false" placeholder="编辑全局播放器 CSS"></textarea>
        <div class="stw-row"><button type="button" id="stw-theme-save" class="stw-btn stw-primary">保存并应用</button><button type="button" id="stw-theme-delete" class="stw-btn stw-danger">删除当前主题</button></div>
      </div>

      <div class="stw-card">
        <div class="stw-card-title">播放设置</div>
        <div class="stw-setting-row"><span>只在已绑定角色时显示</span><label class="stw-switch"><input id="stw-bound-only" type="checkbox"><i></i></label></div>
        <div class="stw-setting-row"><span>切换角色时自动切换歌单</span><label class="stw-switch"><input id="stw-auto-character" type="checkbox"><i></i></label></div>
        <div class="stw-setting-row"><span>角色无专属歌曲时使用全局歌单</span><label class="stw-switch"><input id="stw-fallback-global" type="checkbox"><i></i></label></div>
        <div class="stw-setting-row"><span>切换后尝试自动播放</span><label class="stw-switch"><input id="stw-autoplay" type="checkbox"><i></i></label></div>
        <div class="stw-volume-line"><span>默认音量</span><input id="stw-volume" type="range" min="0" max="1" step="0.01"></div>
        <div class="stw-row"><button type="button" id="stw-data-export" class="stw-btn">导出音乐数据</button><button type="button" id="stw-data-import" class="stw-btn">导入音乐数据</button><input id="stw-data-file" type="file" accept=".json,application/json" hidden></div>
      </div>
    </section>

    <section class="stw-tab-panel" data-panel="character" hidden>
      <div class="stw-card">
        <div class="stw-section-head">
          <div>
            <div class="stw-card-title">角色</div>
            <div class="stw-help">从酒馆已有角色卡中选择一个，所有角色绑定、歌曲和专属皮肤都在该角色里编辑。</div>
          </div>
        </div>
        <div class="stw-row stw-character-tools">
          <input id="stw-character-search" class="stw-character-search" placeholder="搜索角色卡">
          <div class="stw-character-sort"><label for="stw-character-sort">排序</label><select id="stw-character-sort">
            <option value="name-asc">A-Z</option>
            <option value="name-desc">Z-A</option>
            <option value="newest">最新</option>
            <option value="oldest">最老</option>
            <option value="favorites">收藏</option>
            <option value="recent">最近聊天</option>
            <option value="most-chats">最多聊天</option>
            <option value="least-chats">最少聊天</option>
            <option value="most-tokens">最多 Tokens</option>
            <option value="least-tokens">最少 Tokens</option>
            <option value="random">随机</option>
          </select></div>
        </div>
        <div id="stw-character-list" class="stw-character-list"></div>
      </div>
      <div id="stw-role-editor" class="stw-card"></div>
    </section>
  </div>
</div>
