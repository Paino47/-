<div class="stw-settings">
  <div class="stw-settings-head"><div><div class="stw-title">酒馆音乐小组件</div><div class="stw-subtitle">角色歌单 / 全局歌单 / 可导入导出的自定义美化</div></div><label class="stw-switch"><input id="stw-enabled" type="checkbox"><span></span></label></div>
  <div class="stw-tabs"><button class="stw-tab active" data-tab="music">音乐</button><button class="stw-tab" data-tab="theme">美化</button><button class="stw-tab" data-tab="settings">设置</button></div>
  <section class="stw-tab-panel active" data-panel="music">
    <div class="stw-card"><div class="stw-card-title">歌单位置</div><div class="stw-row"><select id="stw-scope"><option value="global">全局歌单</option></select><button id="stw-use-current" class="stw-btn">使用当前角色</button></div><div class="stw-help">全局歌单不会绑定角色；选择角色后，该角色拥有独立歌单。</div></div>
    <div class="stw-card"><div class="stw-card-title">添加歌曲</div><div class="stw-grid"><input id="stw-song-title" placeholder="歌曲名字"><input id="stw-song-url" placeholder="音频 URL（mp3 / m4a / ogg / wav 等）"><input id="stw-song-cover" placeholder="封面 URL（可留空）"></div><button id="stw-add-song" class="stw-btn stw-primary">添加到当前歌单</button></div>
    <div class="stw-card"><div class="stw-card-title">当前歌单</div><div id="stw-playlist" class="stw-playlist"></div></div>
  </section>
  <section class="stw-tab-panel" data-panel="theme">
    <div class="stw-card"><div class="stw-card-title">主题管理</div><div class="stw-row"><select id="stw-theme-select"></select><button id="stw-theme-new" class="stw-btn">新建</button><button id="stw-theme-duplicate" class="stw-btn">复制</button></div><div class="stw-row stw-theme-io"><button id="stw-theme-import" class="stw-btn">导入主题 JSON</button><button id="stw-theme-export" class="stw-btn">导出当前主题</button><input id="stw-theme-file" type="file" accept=".json,application/json" hidden></div></div>
    <div class="stw-card"><div class="stw-card-title">主题信息</div><div class="stw-grid"><input id="stw-theme-name" placeholder="主题名称"><input id="stw-theme-author" placeholder="作者"><input id="stw-theme-version" placeholder="版本号"><input id="stw-theme-launcher" placeholder="悬浮按钮图片 URL（可留空）"><input id="stw-theme-bg" placeholder="播放器背景图片 URL（可留空）"><input id="stw-theme-accent" placeholder="强调色，例如 #9acbff"></div><textarea id="stw-theme-css" class="stw-code" spellcheck="false" placeholder="在这里直接写完整 CSS。主题只影响音乐小组件，不会修改酒馆其他界面。"></textarea><div class="stw-row"><button id="stw-theme-save" class="stw-btn stw-primary">保存并应用</button><button id="stw-theme-delete" class="stw-btn stw-danger">删除当前主题</button></div><div class="stw-help">主题与音乐数据分开保存。导入主题不会覆盖歌单；导出的 JSON 可以直接分享。</div></div>
  </section>
  <section class="stw-tab-panel" data-panel="settings">
    <div class="stw-card"><div class="stw-card-title">播放设置</div><label class="stw-check"><input id="stw-auto-character" type="checkbox"> 切换角色时自动切换到该角色歌单</label><label class="stw-check"><input id="stw-fallback-global" type="checkbox"> 角色没有歌曲时使用全局歌单</label><label class="stw-check"><input id="stw-autoplay" type="checkbox"> 切换歌单后自动播放（浏览器可能限制自动播放）</label><div class="stw-volume-line"><span>默认音量</span><input id="stw-volume" type="range" min="0" max="1" step="0.01"></div></div>
    <div class="stw-card"><div class="stw-card-title">数据</div><div class="stw-row"><button id="stw-data-export" class="stw-btn">导出音乐数据</button><button id="stw-data-import" class="stw-btn">导入音乐数据</button><input id="stw-data-file" type="file" accept=".json,application/json" hidden></div><div class="stw-help">音乐数据和主题数据完全分开。音乐数据导入也不会改动主题。</div></div>
  </section>
</div>
